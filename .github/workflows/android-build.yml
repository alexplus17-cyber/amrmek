name: Build Android debug APK (CI)

on:
  workflow_dispatch: {}
  push:
    branches: [ 'ci/android-build' ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /tmp/android-sdk
      GRADLE_USER_HOME: /tmp/gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: investor-network-mobile/mobile/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('investor-network-mobile/mobile/package-lock.json') }}

      - name: Show repository structure (debug)
        run: |
          echo "PWD: $(pwd)"
          echo "Root listing:"
          ls -la
          echo "Checking investor-network-mobile/mobile:" 
          if [ -d investor-network-mobile/mobile ]; then
            echo "FOUND: investor-network-mobile/mobile"
            ls -la investor-network-mobile/mobile | sed -n '1,200p'
          else
            echo "MISSING: investor-network-mobile/mobile"
          fi

      - name: Install mobile dependencies
        run: |
          if [ -d investor-network-mobile/mobile ]; then
            cd investor-network-mobile/mobile
            echo "Running npm ci in $(pwd)"
            npm ci
          else
            echo "ERROR: investor-network-mobile/mobile directory not found"
            ls -la
            exit 1
          fi

      - name: Prebuild Android (expo prebuild)
        working-directory: investor-network-mobile/mobile
        run: npx expo prebuild -p android --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools and packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build Android Debug APK
        run: |
          cd investor-network-mobile/mobile/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: investor-network-mobile/mobile/android/app/build/outputs/apk/debug/*.apk

